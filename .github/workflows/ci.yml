name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: build
        run: node tools/build.js
      - name: artifact is up to date
        run: git diff --exit-code index.html
      - name: core math tests
        run: node tools/test-core.js
      - name: static single-file gate
        run: node tools/gate.js
      - name: headless browser test
        run: node tools/browser-test.js
